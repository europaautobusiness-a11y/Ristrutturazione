<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagamenti lavori</title>
<meta name="theme-color" content="#1F2A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lavori">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#ECEEEA;--panel:#F8F9F6;--ink:#1F2A2E;--muted:#5D6A6E;--line:#C9CEC6;
  --paid:#2F7A4A;--due:#B7791F;--blue:#2C5F86;--danger:#A33A2A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161C1E;--panel:#1F2729;--ink:#E6EAE6;--muted:#9AA6A8;--line:#344044;
  --paid:#5DBA80;--due:#E0A84A;--blue:#7FB2DA;--danger:#E07B6A;}}
:root[data-theme="dark"]{--bg:#161C1E;--panel:#1F2729;--ink:#E6EAE6;--muted:#9AA6A8;--line:#344044;--paid:#5DBA80;--due:#E0A84A;--blue:#7FB2DA;--danger:#E07B6A;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.num{font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
h1{font-size:1.15rem;font-weight:600;margin:0;color:var(--muted)}
h2{font-size:1.25rem;font-weight:600;margin:32px 0 10px}
.hero{padding:8px 0 4px}
.big{font-size:3.2rem;font-weight:700;line-height:1;margin:10px 0 2px}
.sub{color:var(--muted);font-size:.9rem}
.tape{position:relative;height:34px;margin:22px 0 30px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%) ,var(--panel);border:1px solid var(--line);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--paid);border-radius:3px 0 0 3px;transition:width .6s ease}
.tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.tick span{position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--muted);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stats div{background:var(--panel);padding:10px 12px}
.stats b{display:block;font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-size:1.3rem;font-weight:600}
.stats small{color:var(--muted);font-size:.78rem}
.ivarow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}
.wrap{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem}
td.r,th.r{text-align:right;white-space:nowrap}
.st{font-size:.78rem;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap}
.st.ok{color:var(--paid);border:1px solid var(--paid)}
.st.part{color:var(--due);border:1px solid var(--due)}
.st.no{color:var(--muted);border:1px solid var(--line)}
form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:9px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{grid-column:1/-1;background:var(--ink);color:var(--bg);border:0;border-radius:5px;padding:11px;font:600 .95rem "Public Sans",sans-serif;cursor:pointer}
.btn:disabled{opacity:.5}
.hint{grid-column:1/-1;font-size:.8rem;color:var(--due);margin:0}
.del{background:none;border:0;color:var(--danger);cursor:pointer;font-size:.8rem;padding:2px 4px}
.empty{color:var(--muted);font-size:.9rem;padding:12px 0}
.note{font-size:.8rem;color:var(--muted)}
.banner{font-size:.82rem;background:var(--panel);border-left:3px solid var(--due);padding:8px 10px;margin-top:12px}
@media (max-width:420px){.big{font-size:2.6rem}.stats b{font-size:1.1rem}form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.sec summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sec summary::-webkit-details-marker{display:none}
.sec summary .t{font-weight:600}
.sec summary .m{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.bar{grid-column:1/-1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--paid)}
.sec[open] summary{border-bottom:1px solid var(--line)}
.voce{padding:10px 14px;border-bottom:1px dashed var(--line)}
.voce:last-child{border-bottom:0}
.vh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vh span:first-child{font-size:.92rem}
.vm{font-size:.8rem;color:var(--muted);margin-top:2px}
.pl{margin:6px 0 0;padding:0;list-style:none;font-size:.8rem}
.pl li{display:flex;justify-content:space-between;gap:8px;padding:3px 0 3px 10px;border-left:2px solid var(--line)}
.quick{background:none;border:1px solid var(--blue);color:var(--blue);border-radius:5px;padding:4px 10px;font:500 .8rem "Public Sans",sans-serif;cursor:pointer;margin-top:6px}
.resinfo{grid-column:1/-1;font-size:.82rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-2px 0 0}
.resinfo button{margin:0}
.secTot{font-size:1.15rem;font-weight:600;white-space:nowrap}
.sec summary .m .st{margin-right:6px}
.sync{margin-top:12px;font-size:.82rem;color:var(--muted)}
.sync[data-s="ok"]{color:var(--paid)}
.sync[data-s="err"],.sync[data-s="off"]{color:var(--due)}
.bk{display:flex;gap:10px;flex-wrap:wrap}
.st.over{color:var(--danger);border:1px solid var(--danger)}

.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.top select{flex:1;font-weight:600}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:9px 12px;font:600 .9rem "Public Sans",sans-serif;cursor:pointer;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font:600 1.05rem "Barlow Semi Condensed","Arial Narrow",sans-serif}
.choice{display:grid;gap:10px}
.choice button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;color:var(--ink);font:inherit;cursor:pointer}
.choice button b{display:block;font-size:1rem;margin-bottom:2px}
.choice button span{font-size:.85rem;color:var(--muted)}
.ed-sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
.ed-sec>.row1{display:flex;gap:8px;margin-bottom:8px}
.ed-sec>.row1 input{font-weight:600}
.ed-row{display:grid;grid-template-columns:56px 1fr 96px 28px;gap:6px;margin-bottom:6px;align-items:start}
.ed-row input{padding:7px 8px;font-size:.88rem}
.ed-x{background:none;border:0;color:var(--danger);font-size:1.1rem;cursor:pointer;padding:6px 0}
.ed-add{background:none;border:1px dashed var(--line);color:var(--blue);border-radius:5px;padding:7px;width:100%;font:500 .85rem "Public Sans",sans-serif;cursor:pointer}
.tr-row{display:grid;grid-template-columns:70px 1fr 28px;gap:6px;margin-bottom:6px}
.check{font-size:.88rem;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);margin:12px 0}
.check.ok{border-color:var(--paid);color:var(--paid)}
.check.warn{border-color:var(--due);color:var(--due)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.ghost{flex:1;background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:11px;font:600 .95rem "Public Sans",sans-serif;cursor:pointer}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.danger{color:var(--danger)!important;border-color:var(--danger)!important}
@media (max-width:420px){.ed-row{grid-template-columns:48px 1fr 84px 24px}}
</style>
</head>
<body>
<main id="root"></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
var CFG=window.APP_CONFIG||{};
var SUPABASE_URL=CFG.SUPABASE_URL||"",SUPABASE_KEY=CFG.SUPABASE_KEY||"",AI_FUNCTION=CFG.AI_FUNCTION||"estrai-preventivo";

/* Voci del primo preventivo: servono solo per convertire i dati della versione precedente */
var LEGACY=[["Demolizioni",[["1","Demolizioni (pavimenti balconi, pareti, finestra, nuova porta)",1500]]],["Tracce",[["2","N. 30 tracce con ripristino in malta fibrorinforzata",1800]]],["Cartongesso",[["3","Disimpegno doppia lastra, 42 mq",1806]]],["Bagno",[["4","Assistenza idraulico, massetto, piatto doccia, stabilitura",1000]]],["Putrella",[["5a","Fornitura putrella",500],["5b","Posa putrella con malta antiritiro",400]]],["Blindata e porte",[["6a","Fornitura porta cantina in acciaio",150],["6b","Posa porta cantina",80],["6c","Posa 4 porte interne",280],["6d","Fornitura 4 porte interne",400]]],["Finitura muri e soffitti",[["7","Picozzatura, aggrappante, pronto e gesso (circa 100 mq)",2200]]],["Imbiancatura",[["8a","Idropittura lavabile, 124 mq",1000],["8b","Pittura al quarzo, 57 mq",456]]],["Zoccolini",[["9a","Posa zoccolini",300],["9b","Fornitura zoccolini, 50 ml",500]]],["Muro divisorio",[["10","Muro in porizzato verso appartamento Mirko",500]]],["Serramenti (fornitura)",[["11a","Portoncino d'ingresso",1100],["11b","Finestra bagno",200],["11c","Finestra zona giorno",400],["11d","Finestra camera",400],["11e","Portafinestra",700],["11f","Quota 1/3 portoncino comune",400]]],["Trasporto e magazzino infissi",[["12","Quota 1/4 trasporto e magazzino",120]]],["Installazione infissi",[["13","Posa portoncino, finestre e portafinestra",750]]],["Tapparelle motorizzate",[["14","Rullo e motore, 4 tapparelle",800]]],["Cassonetti",[["15","4 cassonetti per avvolgibili",1120]]],["Pavimenti e rivestimenti",[["16a","Fornitura piastrelle, 100 mq",2000],["16b","Preparazione fondi e posa, 100 mq",2800]]],["Impianto idraulico",[["17","Bagno e cucina, allacci, sanitari, caldaia, termosifoni",6000]]],["Impianto elettrico",[["18","Impianto completo, quadro e antenna TV comune",3000]]],["Rasatura esterna",[["19","Rasatura superfici esterne, 65 mq",1430]]],["Smaltimenti",[["20","Smaltimenti",450]]]];
var STD_TRANCHES=[{p:20,n:"Alla firma del contratto"},{p:30,n:"Inizio lavori e ordini materiali"},{p:40,n:"SAL entro fine lavori"},{p:10,n:"30 gg dalla fine lavori"}];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var fmt=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
function eur(n){return fmt.format(Math.round(n*100)/100)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function itDate(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function r2(n){return Math.round(n*100)/100}
function num(v){if(typeof v==="number")return v;v=String(v||"").replace(/[€\s]/g,"");if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,"").replace(",",".");else v=v.replace(/,/g,"");var n=parseFloat(v);return isNaN(n)?0:n}

/* ---------- dati ---------- */
function legacyProject(old){
  return {id:"trilocale-c",name:"Trilocale Unità C",impresa:"Bardhollari Valerio",ref:"Prev. 12-13/2026",iva:typeof old.iva==="number"?old.iva:0,
    sections:LEGACY.map(function(g){return{name:g[0],voci:g[1].map(function(v){return{id:v[0],code:v[0],desc:v[1],net:v[2]}})}}),
    tranches:STD_TRANCHES.slice(),payments:old.payments||[],extras:old.extras||[],created:"2026-10-04"};
}
function normalize(o){
  if(!o||typeof o!=="object")o={};
  if(!Array.isArray(o.projects)){
    var hasOld=Array.isArray(o.payments);
    o={v:2,projects:hasOld?[legacyProject(o)]:[],current:hasOld?"trilocale-c":null};
  }
  o.projects.forEach(function(p){p.payments=p.payments||[];p.extras=p.extras||[];p.tranches=p.tranches||[];p.sections=p.sections||[];if(typeof p.iva!=="number")p.iva=0});
  if(!o.projects.some(function(p){return p.id===o.current}))o.current=o.projects.length?o.projects[0].id:null;
  return o;
}
var data;
try{data=JSON.parse(localStorage.getItem("lavoriData")||"null")||JSON.parse(localStorage.getItem("trilocaleC")||"null")}catch(e){data=null}
data=normalize(data);
function cur(){return data.projects.find(function(p){return p.id===data.current})||null}

var view="project",draft=null,aiBusy=false,aiMsg="";
var openSecs={};try{openSecs=JSON.parse(sessionStorage.getItem("lavoriOpen")||"{}")}catch(e){}

/* ---------- vista progetto ---------- */
function allVoci(P){
  var s=P.sections.map(function(x){return{name:x.name,voci:x.voci}});
  if(P.extras.length)s.push({name:"Opere extra",extra:true,voci:P.extras.map(function(x){return{id:"x"+x.id,code:"",desc:x.desc,net:+x.amount,xid:x.id}})});
  return s;
}
function chip(due,paid){
  if(paid>due+0.5)return '<span class="st over">'+eur(paid-due)+' in più</span>';
  if(paid>=due-0.5&&due>0)return '<span class="st ok">Saldata</span>';
  if(paid>0)return '<span class="st part">Acconto</span>';
  return '<span class="st no">Da pagare</span>';
}
function topBar(){
  var opts=data.projects.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===data.current?' selected':'')+'>'+esc(p.name)+'</option>'}).join("");
  return '<div class="top">'+(data.projects.length?'<select id="projSel" aria-label="Progetto">'+opts+'</select>':'<span style="flex:1"></span>')+'<button class="iconbtn" id="newProj">+ Nuovo</button></div>';
}
function renderProject(){
  var P=cur();
  if(!P){return topBar()+'<section class="hero"><h2>Nessun progetto</h2><p class="sub">Crea il primo progetto: carica il preventivo e l\'app prepara da sola tutte le voci.</p></section><button class="btn" id="newProj2" style="width:100%">Crea il primo progetto</button>'+footer()}
  var k=1+P.iva/100,secs=allVoci(P),byVoce={};
  P.payments.forEach(function(p){var v=p.voce||"gen";(byVoce[v]=byVoce[v]||[]).push(p)});
  var baseNet=P.sections.reduce(function(t,s){return t+s.voci.reduce(function(a,v){return a+(+v.net||0)},0)},0);
  var extrasNet=P.extras.reduce(function(t,x){return t+(+x.amount||0)},0);
  var total=(baseNet+extrasNet)*k,paid=P.payments.reduce(function(t,p){return t+(+p.amount||0)},0),left=total-paid;
  var pct=total>0?Math.min(100,paid/total*100):0,dueMap={};
  var secHtml=secs.map(function(s,si){
    var sDue=0,sPaid=0;
    var vh=s.voci.map(function(v){
      var due=v.net*k;dueMap[v.id]=due;
      var ps=(byVoce[v.id]||[]).slice().sort(function(a,b){return a.date<b.date?-1:1});
      var vp=ps.reduce(function(t,p){return t+(+p.amount)},0);sDue+=due;sPaid+=vp;
      var list=ps.length?'<ul class="pl">'+ps.map(function(p){return '<li><span>'+itDate(p.date)+' '+esc(p.tipo||"Acconto")+(p.ref?' ('+esc(p.ref)+')':'')+'</span><span>'+eur(+p.amount)+' <button class="del" data-del="p:'+p.id+'" aria-label="Elimina pagamento">×</button></span></li>'}).join("")+'</ul>':'';
      return '<div class="voce"><div class="vh"><span>'+(v.code?esc(v.code)+'. ':'')+esc(v.desc)+'</span>'+chip(due,vp)+'</div><div class="vm">Totale '+eur(due)+(vp?' – pagato '+eur(vp)+' – manca '+eur(Math.max(0,due-vp)):'')+'</div>'+list+
        (vp<due-0.5?'<button class="quick" data-pay="'+esc(v.id)+'">Registra pagamento</button>':'')+(s.extra?' <button class="del" data-del="e:'+v.xid+'">Elimina extra</button>':'')+'</div>';
    }).join("");
    var sp=sDue>0?Math.min(100,sPaid/sDue*100):0,key=P.id+":"+si;
    return '<details class="sec" data-sec="'+esc(key)+'"'+(openSecs[key]?' open':'')+'><summary><span class="t">'+esc(s.name)+'</span><span class="secTot num">'+eur(sDue)+'</span><span class="m">'+chip(sDue,sPaid)+' '+(sPaid?'Versato '+eur(sPaid)+' ('+Math.round(sDue?sPaid/sDue*100:0)+'%)'+(sPaid<sDue-0.5?' – mancano '+eur(sDue-sPaid):''):'Nessun versamento')+'</span><span class="bar"><i style="width:'+sp+'%"></i></span></summary>'+vh+'</details>';
  }).join("");
  var gen=byVoce.gen||[];
  var genHtml=gen.length?'<h2>Pagamenti non assegnati a una voce</h2><div class="sec"><div class="voce"><ul class="pl">'+gen.map(function(p){return '<li><span>'+itDate(p.date)+' '+esc(p.tipo||"Acconto")+(p.note?' – '+esc(p.note):'')+'</span><span>'+eur(+p.amount)+' <button class="del" data-del="p:'+p.id+'" aria-label="Elimina pagamento">×</button></span></li>'}).join("")+'</ul></div></div>':'';
  var ticks="",rows="",cum=0,paidLeft=paid,trSum=P.tranches.reduce(function(t,x){return t+(+x.p||0)},0);
  P.tranches.forEach(function(t,i){
    var amt=baseNet*k*t.p/100;if(i===P.tranches.length-1)amt+=extrasNet*k;cum+=amt;
    var pos=total?cum/total*100:0;
    if(i<P.tranches.length-1&&pos<100)ticks+='<div class="tick" style="left:'+pos+'%"><span>'+Math.round(pos)+'%</span></div>';
    var cov=Math.max(0,Math.min(amt,paidLeft));paidLeft-=cov;
    var st=cov>=amt-0.5?'<span class="st ok">Coperta</span>':cov>0?'<span class="st part">'+eur(amt-cov)+' da dare</span>':'<span class="st no">Da pagare</span>';
    rows+='<tr><td>'+(i+1)+'. '+esc(t.n)+' ('+t.p+'%)</td><td class="r">'+eur(amt)+'</td><td class="r">'+st+'</td></tr>';
  });
  var opts='<option value="gen">Non assegnato (acconto generico)</option>'+secs.map(function(s){return '<optgroup label="'+esc(s.name)+'">'+s.voci.map(function(v){return '<option value="'+esc(v.id)+'">'+esc((v.code?v.code+". ":"")+v.desc)+'</option>'}).join("")+'</optgroup>'}).join("");
  var ivaBtns=[0,10,22].map(function(v){return '<button type="button" data-iva="'+v+'" aria-pressed="'+(P.iva===v)+'">'+v+'%</button>'}).join("");
  renderProject.dueMap=dueMap;renderProject.byVoce=byVoce;
  return topBar()+
  '<section class="hero"><h1>'+esc([P.impresa,P.ref].filter(Boolean).join(" – ")||"Preventivo")+'</h1>'+
  '<div class="big num">'+eur(Math.max(0,left))+'</div>'+
  '<div class="sub">'+(left<-0.5?'Hai pagato '+eur(-left)+' più del totale':'ancora da pagare su '+eur(total)+(P.iva?' IVA inclusa':' (IVA esclusa)'))+'</div>'+
  '<div class="tape" role="img" aria-label="Pagato il '+Math.round(pct)+' percento"><div class="fill" style="width:'+pct+'%"></div>'+ticks+'</div>'+

function fileToBase64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.onerror=function(){rej(new Error("Lettura del file non riuscita"))};r.readAsDataURL(f)})}
function shrinkImage(f){
  return new Promise(function(res){
    var img=new Image(),u=URL.createObjectURL(f);
    img.onload=function(){var max=2000,w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res({b64:c.toDataURL("image/jpeg",.85).split(",")[1],type:"image/jpeg"})};
    img.onerror=function(){URL.revokeObjectURL(u);res(null)};img.src=u;
  });
}
function extract(f){
  var isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
  if(!isPdf&&f.type.indexOf("image/")!==0){aiMsg="Formato non supportato: carica un PDF o una foto.";render();return}
  if(isPdf&&f.size>15*1024*1024){aiMsg="Il PDF supera i 15 MB: prova a comprimerlo o a fotografare le pagine.";render();return}
  aiBusy=true;aiMsg="";render();
  var prep=isPdf?fileToBase64(f).then(function(b){return{b64:b,type:"application/pdf"}}):shrinkImage(f).then(function(r){return r||fileToBase64(f).then(function(b){return{b64:b,type:f.type}})});
  prep.then(function(x){return sb.functions.invoke(AI_FUNCTION,{body:{file:x.b64,media_type:x.type}})}).then(function(r){
    if(r.error){
      var m=r.error.message||"Errore";
      return (r.error.context&&r.error.context.json?r.error.context.json().then(function(b){throw new Error(b&&b.error||m)},function(){throw new Error(m)}):Promise.reject(new Error(m)));
    }
    var d=r.data;if(typeof d==="string")d=JSON.parse(d);
    if(!d||!Array.isArray(d.sezioni)||!d.sezioni.length)throw new Error("Non ho trovato voci con importi nel documento.");
    draft={id:null,name:d.titolo||"",impresa:d.impresa||"",ref:d.riferimento||"",iva:typeof d.iva_percentuale==="number"?d.iva_percentuale:10,
      sections:d.sezioni.map(function(s){return{name:s.nome||"",voci:(s.voci||[]).map(function(v){return{id:uid(),code:String(v.codice||""),desc:v.descrizione||"",net:r2(num(v.importo))}})}}).filter(function(s){return s.voci.length}),
      tranches:(d.rate||[]).map(function(t){return{p:num(t.percentuale),n:t.descrizione||""}}).filter(function(t){return t.p>0}),
      declared:d.totale_imponibile!=null?num(d.totale_imponibile):null,notes:d.note||""};
    aiBusy=false;view="editor";render();window.scrollTo(0,0);
  }).catch(function(err){aiBusy=false;aiMsg="Lettura non riuscita: "+(err&&err.message||err)+". Riprova o inserisci le voci a mano.";render()});
}

/* ---------- sincronizzazione ---------- */
var sb=null,session=null,syncState="local",dirty=false,needLogin=false,loginMsg="";
try{dirty=localStorage.getItem("lavoriDirty")==="1"||localStorage.getItem("trilocaleDirty")==="1"}catch(e){}
function cloudOn(){return SUPABASE_URL.indexOf("https://")===0&&!!SUPABASE_KEY&&!!window.supabase}
function syncText(){return{local:"Dati salvati solo su questo dispositivo",sync:"Sincronizzazione in corso…",ok:"✓ Sincronizzato nel cloud",off:"Offline: le modifiche verranno inviate appena torna la rete",err:"Sincronizzazione non riuscita: riprovo alla prossima modifica"}[syncState]}
function setSync(st){syncState=st;var el=document.getElementById("sync");if(el){el.textContent=syncText();el.dataset.s=st}}
function setDirty(v){dirty=v;try{localStorage.setItem("lavoriDirty",v?"1":"0")}catch(e){}}
function storeLocal(){try{localStorage.setItem("lavoriData",JSON.stringify(data))}catch(e){alert("Impossibile salvare sul dispositivo: spazio pieno o navigazione privata.")}}
function save(){storeLocal();if(sb&&session){setDirty(true);render();push()}else render()}
var pushing=null;
function push(){
  if(!sb||!session)return Promise.resolve();
  if(pushing)return pushing.then(function(){if(dirty)return push()});
  setSync("sync");
  pushing=sb.from("lavori_tracker").upsert({user_id:session.user.id,data:data,updated_at:new Date().toISOString()}).then(function(r){
    pushing=null;if(r.error)setSync(navigator.onLine?"err":"off");else{setDirty(false);setSync("ok")}
  },function(){pushing=null;setSync(navigator.onLine?"err":"off")});
  return pushing;
}
function pull(){
  if(!sb||!session)return;
  if(dirty){push();return}
  setSync("sync");
  sb.from("lavori_tracker").select("data").eq("user_id",session.user.id).maybeSingle().then(function(r){
    if(r.error){setSync(navigator.onLine?"err":"off");return}
    if(r.data&&r.data.data){
      var wasOld=!Array.isArray(r.data.data.projects);
      data=normalize(r.data.data);storeLocal();
      if(wasOld){setDirty(true);push()}else setSync("ok");
      if(view==="project")render();
    }else{setDirty(true);push()}
  },function(){setSync("off")});
}
function renderLogin(msg){
  document.getElementById("root").innerHTML='<section class="hero"><h1>Pagamenti lavori</h1><h2>Accedi per sincronizzare</h2></section>'+
  '<form id="fl"><label class="full">Email<input type="email" name="email" autocomplete="username" required></label><label class="full">Password<input type="password" name="pw" autocomplete="current-password" required></label>'+
  (msg?'<p class="hint">'+esc(msg)+'</p>':'')+'<button class="btn" type="submit">Accedi</button></form>';
  var fl=document.getElementById("fl");
  fl.addEventListener("submit",function(e){e.preventDefault();fl.querySelector(".btn").disabled=true;
    sb.auth.signInWithPassword({email:fl.querySelector('[name=email]').value.trim(),password:fl.querySelector('[name=pw]').value}).then(function(r){
      if(r.error){loginMsg=navigator.onLine?"Email o password non corrette.":"Serve la connessione per il primo accesso.";renderLogin(loginMsg);return}
      session=r.data.session;needLogin=false;render();pull();
    })});
}
function startCloud(){
  if(!cloudOn()){setSync("local");return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.getSession().then(function(r){
    session=r.data&&r.data.session;
    if(!session){needLogin=true;render();return}
    render();pull();
  });
  sb.auth.onAuthStateChange(function(ev,s){if(s)session=s});
  window.addEventListener("online",function(){if(dirty)push();else pull()});
  window.addEventListener("offline",function(){setSync("off")});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&view==="project")pull()});
}

/* ---------- backup ---------- */
document.addEventListener("click",function(e){
  var id=e.target.id;
  if(id==="exp"){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),name="backup-lavori-"+today()+".json";
    var f=null;try{f=new File([blob],name,{type:"application/json"})}catch(x){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Backup pagamenti lavori"}).catch(function(){})}
    else{var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
  }
  if(id==="imp")document.getElementById("impFile").click();
  if(id==="logout"&&sb){if(dirty&&!confirm("Ci sono modifiche non ancora sincronizzate. Uscire comunque?"))return;sb.auth.signOut().then(function(){session=null;needLogin=true;render()})}
});
document.addEventListener("change",function(e){
  if(e.target.id!=="impFile"||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){try{var o=normalize(JSON.parse(r.result));
    if(!confirm("Sostituire i dati attuali con quelli del backup ("+o.projects.length+" progetti)?"))return;
    data=o;view="project";save();alert("Backup ripristinato.")}catch(x){alert("File non valido: scegli un backup esportato da questa app.")}};
  r.readAsText(e.target.files[0]);e.target.value="";
});

render();
startCloud();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
